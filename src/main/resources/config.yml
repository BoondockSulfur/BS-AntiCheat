# BSAntiCheat Configuration
# AntiCheat plugin for Paper 1.21.x

# Language: en (English) or de (German)
language: en

# Database Configuration (SQLite)
database:
  sqlite_file: "plugins/BSAntiCheat/anticheat.db"
  pool:
    max_pool_size: 5
    minimum_idle: 1
    connection_timeout_ms: 10000
  retention_days: 30
  fallback_file_logging: true
  fallback_log_file: "plugins/BSAntiCheat/fallback.log"

# Debug Mode
debug_mode: false

# AntiCheat Settings
anticheat:
  # Skip movement/combat/world/packet checks while recent TPS is below this value,
  # so server lag spikes don't cause false positives.
  lag_exempt_tps: 18.0

  # Transaction latency (requires PacketEvents): ticks between the ping packet sent to
  # each player to measure true round-trip latency. Lower = finer resolution, but it is
  # pure per-player packet overhead — 1 means 20 extra packets/second/player. Raise this
  # on servers with a high player count. Applied at startup (needs a restart, not /reload).
  transaction_interval_ticks: 2

  # Exempt Bedrock players connecting through Geyser/Floodgate. Their client uses
  # different movement physics (jump/sprint/step), which a Java-tuned anticheat would
  # otherwise flag. Requires the Geyser/Floodgate plugin to be installed to take effect.
  exempt_bedrock_players: true

  # Exempt legacy clients (older than legacy_protocol_threshold) connecting through
  # ViaVersion — their combat/movement timing differs. Off by default (opt-in), since
  # exempting them weakens the anticheat. 767 = protocol 1.21; lower clients are exempt.
  exempt_legacy_clients: false
  legacy_protocol_threshold: 767

  # Detection Toggles
  xray_detection: true
  movement_checks: true
  speed_detection: true
  fly_detection: true
  groundspoof_detection: true
  # Sustained ascent — OFF by default. The hover check counts only genuine hanging (vertical
  # movement inside one tick of gravity), because a climb is not hovering: a wind charge, a
  # Wind Burst mace or a Breeze throws players upwards for longer than any knockback grace
  # lasts. This check watches the gap that leaves — a climb that does NOT shed vertical speed
  # the way gravity requires, i.e. one nothing threw. Calibrate with debug_mode (logs
  # [ASCENT-DEBUG] dy and decay per sample) before switching it on.
  sustained_ascent_detection: false
  # NoSlow/Jesus/Spider/Step are FP-prone movement micro-heuristics — OFF by default.
  # Enable them only if you accept occasional false positives (jumping next to a wall,
  # walking while using an item, crossing water fast can trigger them).
  noslow_detection: false
  jesus_detection: false
  spider_detection: false
  step_detection: false
  teleport_detection: true
  # Elytra/Riptide speed ceiling (PlayerMoveEvent-based, separate physics from ground moves)
  elytra_detection: true
  # Vehicle checks (Boat-Fly, vehicle speed) — run on VehicleMoveEvent, since
  # PlayerMoveEvent does not fire while a player rides a vehicle.
  vehicle_checks: true
  combat_checks: true
  reach_detection: true
  killaura_detection: true
  # Criticals: OFF by default. The server only awards a critical hit when the player is
  # airborne AND falling, so "critical while standing on the ground" is a contradiction
  # no legitimate vanilla crit can produce — in practice it only fires on damage events
  # synthesised by other plugins (custom-item and mob plugins do this), i.e. it flags
  # players for using their own gear. It also does NOT catch the real Criticals cheat,
  # which fakes micro-falls so the crit is computed while the player reports airborne;
  # telling that apart from a legitimate jump-crit needs per-tick vertical movement from
  # the packet layer. Enable only on servers without damage-modifying plugins.
  criticals_detection: false
  # AutoBlock: OFF by default — vanilla allows attacking with the main hand while an
  # offhand shield is raised, so this flags ordinary sword+shield play. Opt-in only.
  autoblock_detection: false
  # Velocity / AntiKnockback: flag players who don't apply server-sent knockback.
  # OFF by default — the displacement measurement still needs rework before it is
  # false-positive-safe (it can misread legit knockback as ignored). Opt-in only.
  velocity_detection: false
  world_checks: true
  nuker_detection: true
  fastplace_detection: true
  scaffold_detection: true
  # FastBreak: per-block break time vs. the expected vanilla time (tool/haste included)
  fastbreak_detection: true
  # Inventory checks: walking with open container, ChestStealer, FastUse, BowSpam, AutoTotem
  inventory_checks: true
  inventorymove_detection: true
  cheststealer_detection: true
  fastuse_detection: true
  bowspam_detection: true
  autototem_detection: true
  packet_checks: true
  autoclicker_detection: true
  badpackets_detection: true
  timer_detection: true
  aimsnap_detection: true
  # Crash protection: cancels oversized book/sign packets. Packet flood: raw
  # packets per second per connection (vanilla stays well below 200/s).
  crasher_detection: true
  packetflood_detection: true
  packetflood_max_per_second: 500
  # How many consecutive one-second windows must exceed the limit. A connection that
  # stalled and then flushes its queue floods exactly ONE window — a real attack floods
  # every window it lasts. 1 restores the old (false-positive-prone) behaviour.
  packetflood_windows: 2

  # Calibration thresholds. Each value is the default; lower a *_violations count for
  # faster/stricter detection, raise it to reduce false positives. Tune with debug_mode
  # on and punishments off, then apply with /bsac reload — no restart or rebuild needed.
  thresholds:
    # Movement extras: consecutive over-threshold samples before flagging
    groundspoof_violations: 4
    noslow_violations: 5
    noslow_speed_multiplier: 0.8   # allowed fraction of walk speed while using an item
    jesus_violations: 8
    spider_violations: 8
    step_violations: 5
    step_max_height: 0.75          # vanilla auto-step is 0.6
    sustained_ascent_violations: 8    # consecutive climbing samples with too little decay (~0.4s)
    sustained_ascent_min_decay: 0.05  # b/t a real ballistic rise sheds per tick (gravity is 0.08)
    elytra_violations: 3
    scaffold_violations: 3
    # Rate checks: how many one-second windows in a row must exceed the limit. Plugins that
    # break several blocks per action (vein miners, custom tools) and packet bundles cross a
    # per-second cap once without anyone cheating; a cheat holds the rate up.
    nuker_violations: 3
    fastplace_violations: 3
    # KillAura multi-target: a crowded fight can legitimately put several players within
    # reach inside the 250ms window once.
    killaura_multi_violations: 2
    # Vehicle
    boatfly_violations: 10
    vehicle_speed_violations: 5
    # Combat extras. Reach/KillAura-angle need this many suspicious hits within a short
    # window (10s) — single hits are noisy (latency moves both hitboxes, flick hits are
    # judged against the pre-flick rotation).
    reach_violations: 3
    killaura_angle_violations: 3
    criticals_violations: 3
    autoblock_violations: 2
    velocity_violations: 3
    velocity_min_apply_ratio: 0.33   # flag when applied knockback < expected * this
    # World
    fastbreak_violations: 3
    fastbreak_tolerance: 0.7       # flag when dig time < expected * this
    # Inventory / item timing
    inventorymove_violations: 8
    inventorymove_min_speed: 0.15  # blocks/move counted as walking with a GUI open
    cheststealer_min_clicks: 6
    cheststealer_max_interval_ms: 40
    # Intervals below this are ignored entirely: neither a human nor an autoclicker can
    # produce separate clicks that fast (>100 CPS), so they only occur when the network
    # delivered several clicks in one bundle.
    cheststealer_min_interval_ms: 10
    fastuse_violations: 2
    fastuse_min_interval_ms: 600
    bowspam_violations: 3
    bowspam_min_interval_ms: 700
    bowspam_min_force: 0.9         # only near-full-charge shots are counted
    autototem_max_reaction_ms: 150

  # Combat: maximum allowed attack distance (blocks). Vanilla survival reach is ~3.0;
  # a generous default avoids false positives from latency/hitbox. Creative is exempt.
  reach_distance: 4.0
  # KillAura: flag hits landed more than this many degrees off the attacker's aim, or
  # hitting at least killaura_multi_targets distinct entities within a few milliseconds.
  killaura_max_angle: 75.0
  killaura_multi_targets: 3
  killaura_players_only: true   # only run KillAura against player targets (avoids mob-grinding false positives)
  # KillAura rotation GCD (EXPERIMENTAL): human mouse input is quantised; programmatic aim
  # has a tiny gcd. OFF by default — enable debug_mode, watch [ROT-DEBUG] gcd= values for
  # legit players vs cheats, set killaura_rotation_min_gcd between them, then enable.
  killaura_rotation_detection: false
  killaura_rotation_samples: 20
  killaura_rotation_min_gcd: 8000

  # World: max blocks broken/placed per second before flagging. Generous defaults so
  # legitimate fast mining is not flagged — Efficiency V + Haste II instamines up to
  # 20 blocks/s, real nukers break 50+.
  nuker_max_breaks_per_second: 25
  fastplace_max_per_second: 12
  # Scaffold: flag placing blocks more than this many degrees off the player's aim
  # (bridging/towering "blind"), sustained over a few placements.
  scaffold_max_angle: 80.0

  # Packet-level: max clicks per second from arm-swings (mining swings are excluded).
  # Skilled humans reach ~17-21 by jitter clicking and 20-25 by butterfly clicking, so 22
  # sat inside what a hand can do. Note the count comes from a sliding window over packet
  # ARRIVAL times, which network jitter can lift a little above what was actually clicked.
  autoclicker_max_cps: 25
  # AutoClicker pattern analysis (EXPERIMENTAL, off by default): flags overly consistent
  # attack intervals. Can false-positive on held attacks; calibrate with debug_mode before
  # enabling.
  autoclicker_consistency: false
  autoclicker_min_samples: 15        # swings needed before judging consistency
  autoclicker_min_cps: 2             # analyze consistency at/above this click rate (2 = also catch slow autoclickers)
  # Three "robotic" markers; a player is flagged when at least min_signals of them hold.
  # Humans usually fail ALL three (they jitter and pause); autoclickers fail at most one.
  autoclicker_max_deviation_ms: 30   # marker 1: std-dev of intervals (ms) at/below this
  autoclicker_max_cv: 0.30           # marker 2: std-dev / mean (consistency vs. click rate)
  autoclicker_max_outlier_ratio: 0.06 # marker 3: share of long-pause intervals (>1.5x median)
  # How many markers must hold to flag. Markers 1 and 2 both measure jitter and rise
  # together, so a human clicking steadily trips BOTH — 2 is not the safe middle it
  # looks like. Marker 3 (do they ever pause?) is the independent one. Keep this at 3
  # unless your debug data shows your players clearly separated from the cheats.
  autoclicker_min_signals: 3
  # Timer: allowed "ahead of real time" balance (ms) before flagging game-speed/timer hacks.
  timer_max_balance_ms: 200
  # ...and how long the balance must STAY over that limit to count. TCP delivers packets
  # in bundles: five movement packets arriving in the same millisecond each credit a full
  # tick with no real time to subtract, so the balance jumps by exactly 5x50ms and crosses
  # any limit instantly. The gap that always follows such a bundle pulls it straight back
  # down, while a real timer hack holds it up for as long as it runs. Set to 0 to flag on
  # the first crossing (the old behaviour — expect false alerts on poor connections).
  timer_sustained_ms: 1000
  # AimSnap: catches a rotation that snaps to a target and back within ~1 tick (look A ->
  # far B -> back near A) — robotic aim used by rotation-spoofing scaffold/killaura. Flags
  # after this many snaps within the window. Raise min_angle / threshold if fast PvP flicks
  # cause false positives.
  aimsnap_min_angle: 40.0      # the snap-out and snap-back must each exceed this (degrees)
  aimsnap_return_angle: 15.0   # ...and the net move must return within this of the start
  aimsnap_window_ms: 3000
  aimsnap_threshold: 3

  # XRay Settings
  xray_timewindow_seconds: 60
  # How many SEPARATE deposits the ore must come from before a count over the threshold
  # counts as evidence. The block count alone cannot tell one thick vein from a dozen
  # scattered finds — copper and redstone veins run past 20 blocks, overlapping diamond
  # veins reach ten, and a vein-miner tool takes a whole vein in one action. Knowing where
  # several separate deposits are without searching is the thing X-Ray actually provides.
  xray_min_veins: 3
  # Count only ore that was still HIDDEN in rock when it was broken.
  # X-Ray tells someone where ore is that they cannot see, and acting on that means digging
  # to it. Emptying an open cave means taking ore off walls that were visible all along — it
  # produces the same "lots of ore, hardly any stone" statistics, in fact even more extreme,
  # because nothing has to be dug at all. Without this, a player who finds a large untouched
  # cave system is flagged for having found it.
  # Faces the player opened themselves within the time window do not count as visibility, so
  # a tunnel dug straight to a hidden ore does not excuse it.
  # Alerts read "DIAMOND x10/38" = ten of the thirty-eight broken were hidden.
  xray_require_hidden: true
  xray_excluded_ores: []
  # Ore/stone ratio: cave and deepslate miners legitimately hit >10% (they mine the
  # ores they see plus little stone), so 0.15 leaves headroom for normal mining.
  xray_stone_ore_ratio: 0.15
  # Worlds where XRay detection is skipped entirely (e.g. resource/farm worlds that get
  # reset). Note: cheaters often mine in exactly these worlds — prefer raising the
  # thresholds below before fully exempting a world.
  xray_exempt_worlds: []
  # Combined rare-ore count (diamond + emerald + ancient debris together) per time window
  xray_rare_combined_threshold: 12

  # Per-Ore Thresholds (ores mined per time window). Coal/iron/copper allow for the
  # 1.18+ giant ore veins and large mountain seams; redstone/lapis/diamond/gold allow
  # for beacon (Haste II) + Efficiency V deepslate branch mining, which legitimately
  # clears the old lower limits (confirmed via live alert data).
  xray_thresholds:
    coal: 30
    iron: 25
    copper: 40
    gold: 15
    redstone: 20
    lapis: 15
    diamond: 10
    emerald: 6
    ancient_debris: 3

  # Restricted Worlds (instant alerts when ores are mined)
  restricted_worlds: []
  restricted_world_ores: []

  # Punishment / Violation-Level handling
  # Each confirmed detection raises a player's violation level (VL) for that check.
  # VL decays over time. When a check's VL reaches a tier, its commands run from console.
  punishments:
    enabled: false           # master switch — when false the plugin only alerts/logs
    decay_seconds: 300       # a player loses 1 VL per this many seconds without a violation
    setback: false           # teleport movement violators back to their last valid position
    # Console commands per VL threshold. Placeholders: %player%, %check%, %vl%
    # %check% is the name of the check that flagged, e.g. SPEED, FLY, TELEPORT,
    # GROUNDSPOOF, ELYTRA, NOSLOW, JESUS, SPIDER, STEP, REACH, KILLAURA, CRITICALS,
    # AUTOBLOCK, VELOCITY, NUKER, FASTPLACE, FASTBREAK, SCAFFOLD, BOATFLY,
    # VEHICLE_SPEED, INVENTORYMOVE, CHESTSTEALER, FASTUSE, BOWSPAM, AUTOTOTEM,
    # AUTOCLICKER, BADPACKETS, TIMER, AIMSNAP, CRASHER, PACKETFLOOD,
    # XRAY_THRESHOLD, XRAY_RATIO, XRAY_RARE_ORES, RESTRICTED_ZONE.
    # VL is tracked per check, so a tier fires when ONE check reaches the threshold.
    tiers:
      "40":
        - "kick %player% AntiCheat: suspicious %check% activity"

  # OP Bypass
  ops_bypass: false

  # Whitelist (UUIDs)
  whitelist_players: []
  # LuckPerms Group Whitelist
  whitelist_groups: []

  # Movement Speed Thresholds (blocks per tick)
  # Note: speed potions, sprinting, soul speed, ice and ping are compensated automatically.
  speed_thresholds:
    walk: 0.4
    sprint: 0.6
    fly: 1.5
    vertical: 3.5
    teleport: 15.0
    violations_before_alert: 5
    fly_violations_before_alert: 10
    # Elytra/Riptide ceilings in blocks per second, averaged over a 250 ms window.
    # Reference points: rocket-assisted elytra dives reach 100-120 b/s, and a Riptide III
    # trident launches at 3 blocks/tick = 60 b/s before sprint or fall momentum is added.
    # Raise these if item plugins on your server grant faster flight.
    elytra_bps: 140.0
    riptide_bps: 75.0

# Discord Webhook
discord:
  enabled: false
  webhook_url: ""
  alert_types:
    xray: true
    movement: true

# Alert Preferences
alerts:
  silent_players: []
