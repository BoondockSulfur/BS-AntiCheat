# BSAntiCheat Configuration
# AntiCheat plugin for Paper 1.21.x

# Language: en (English) or de (German)
language: en

# Database Configuration (SQLite)
database:
  sqlite_file: "plugins/BSAntiCheat/anticheat.db"
  pool:
    max_pool_size: 5
    minimum_idle: 1
    connection_timeout_ms: 10000
  retention_days: 30
  fallback_file_logging: true
  fallback_log_file: "plugins/BSAntiCheat/fallback.log"

# Debug Mode
debug_mode: false

# AntiCheat Settings
anticheat:
  # Skip movement/combat/world/packet checks while recent TPS is below this value,
  # so server lag spikes don't cause false positives.
  lag_exempt_tps: 18.0

  # Exempt Bedrock players connecting through Geyser/Floodgate. Their client uses
  # different movement physics (jump/sprint/step), which a Java-tuned anticheat would
  # otherwise flag. Requires the Geyser/Floodgate plugin to be installed to take effect.
  exempt_bedrock_players: true

  # Detection Toggles
  xray_detection: true
  movement_checks: true
  speed_detection: true
  fly_detection: true
  groundspoof_detection: true
  noslow_detection: true
  jesus_detection: true
  spider_detection: true
  step_detection: true
  teleport_detection: true
  # Elytra/Riptide speed ceiling (PlayerMoveEvent-based, separate physics from ground moves)
  elytra_detection: true
  # Vehicle checks (Boat-Fly, vehicle speed) — run on VehicleMoveEvent, since
  # PlayerMoveEvent does not fire while a player rides a vehicle.
  vehicle_checks: true
  combat_checks: true
  reach_detection: true
  killaura_detection: true
  # Criticals (crit hit while on ground) and AutoBlock (attacking while shielding)
  criticals_detection: true
  autoblock_detection: true
  world_checks: true
  nuker_detection: true
  fastplace_detection: true
  scaffold_detection: true
  # FastBreak: per-block break time vs. the expected vanilla time (tool/haste included)
  fastbreak_detection: true
  # Inventory checks: walking with open container, ChestStealer, FastUse, BowSpam, AutoTotem
  inventory_checks: true
  inventorymove_detection: true
  cheststealer_detection: true
  fastuse_detection: true
  bowspam_detection: true
  autototem_detection: true
  packet_checks: true
  autoclicker_detection: true
  badpackets_detection: true
  timer_detection: true
  aimsnap_detection: true
  # Crash protection: cancels oversized book/sign packets. Packet flood: raw
  # packets per second per connection (vanilla stays well below 200/s).
  crasher_detection: true
  packetflood_detection: true
  packetflood_max_per_second: 500

  # Combat: maximum allowed attack distance (blocks). Vanilla survival reach is ~3.0;
  # a generous default avoids false positives from latency/hitbox. Creative is exempt.
  reach_distance: 4.0
  # KillAura: flag hits landed more than this many degrees off the attacker's aim, or
  # hitting at least killaura_multi_targets distinct entities within a few milliseconds.
  killaura_max_angle: 75.0
  killaura_multi_targets: 3
  killaura_players_only: true   # only run KillAura against player targets (avoids mob-grinding false positives)
  # KillAura rotation GCD (EXPERIMENTAL): human mouse input is quantised; programmatic aim
  # has a tiny gcd. OFF by default — enable debug_mode, watch [ROT-DEBUG] gcd= values for
  # legit players vs cheats, set killaura_rotation_min_gcd between them, then enable.
  killaura_rotation_detection: false
  killaura_rotation_samples: 20
  killaura_rotation_min_gcd: 8000

  # World: max blocks broken/placed per second before flagging. Generous defaults so
  # legitimate fast mining (Efficiency + Haste on instamine blocks) is not flagged.
  nuker_max_breaks_per_second: 15
  fastplace_max_per_second: 12
  # Scaffold: flag placing blocks more than this many degrees off the player's aim
  # (bridging/towering "blind"), sustained over a few placements.
  scaffold_max_angle: 80.0

  # Packet-level: max ATTACKS per second (counts attack packets, not arm swings, so mining
  # never false-flags). Legit fast clickers reach ~14; autoclickers usually exceed this.
  autoclicker_max_cps: 16
  # AutoClicker pattern analysis (EXPERIMENTAL, off by default): flags overly consistent
  # attack intervals. Can false-positive on held attacks; calibrate with debug_mode before
  # enabling.
  autoclicker_consistency: false
  autoclicker_min_samples: 15        # swings needed before judging consistency
  autoclicker_min_cps: 2             # analyze consistency at/above this click rate (2 = also catch slow autoclickers)
  # Three "robotic" markers; a player is flagged when at least min_signals of them hold.
  # Humans usually fail ALL three (they jitter and pause); autoclickers fail at most one.
  autoclicker_max_deviation_ms: 30   # marker 1: std-dev of intervals (ms) at/below this
  autoclicker_max_cv: 0.30           # marker 2: std-dev / mean (consistency vs. click rate)
  autoclicker_max_outlier_ratio: 0.06 # marker 3: share of long-pause intervals (>1.5x median)
  autoclicker_min_signals: 2         # how many markers must hold to flag (2 = balanced)
  # Timer: allowed "ahead of real time" balance (ms) before flagging game-speed/timer hacks.
  # 200 leaves headroom for short network/packet bursts; real timer hacks blow far past it.
  timer_max_balance_ms: 200
  # AimSnap: catches a rotation that snaps to a target and back within ~1 tick (look A ->
  # far B -> back near A) — robotic aim used by rotation-spoofing scaffold/killaura. Flags
  # after this many snaps within the window. Raise min_angle / threshold if fast PvP flicks
  # cause false positives.
  aimsnap_min_angle: 40.0      # the snap-out and snap-back must each exceed this (degrees)
  aimsnap_return_angle: 15.0   # ...and the net move must return within this of the start
  aimsnap_window_ms: 3000
  aimsnap_threshold: 3

  # XRay Settings
  xray_timewindow_seconds: 60
  xray_excluded_ores: []
  xray_stone_ore_ratio: 0.10

  # Per-Ore Thresholds (ores mined per time window)
  xray_thresholds:
    coal: 20
    iron: 15
    copper: 15
    gold: 10
    redstone: 10
    lapis: 8
    diamond: 6
    emerald: 4
    ancient_debris: 3

  # Restricted Worlds (instant alerts when ores are mined)
  restricted_worlds: []
  restricted_world_ores: []

  # Punishment / Violation-Level handling
  # Each confirmed detection raises a player's violation level (VL) for that check.
  # VL decays over time. When a check's VL reaches a tier, its commands run from console.
  punishments:
    enabled: false           # master switch — when false the plugin only alerts/logs
    decay_seconds: 300       # a player loses 1 VL per this many seconds without a violation
    setback: false           # teleport movement violators back to their last valid position
    # Console commands per VL threshold. Placeholders: %player%, %check%, %vl%
    # check values: SPEED, FLY, TELEPORT, XRAY_THRESHOLD, XRAY_RATIO, XRAY_RARE_ORES, RESTRICTED_ZONE
    tiers:
      "40":
        - "kick %player% AntiCheat: suspicious %check% activity"

  # OP Bypass
  ops_bypass: false

  # Whitelist (UUIDs)
  whitelist_players: []
  # LuckPerms Group Whitelist
  whitelist_groups: []

  # Movement Speed Thresholds (blocks per tick)
  # Note: speed potions, sprinting, soul speed, ice and ping are compensated automatically.
  speed_thresholds:
    walk: 0.4
    sprint: 0.6
    fly: 1.5
    vertical: 3.5
    teleport: 15.0
    violations_before_alert: 5
    fly_violations_before_alert: 10

# Discord Webhook
discord:
  enabled: false
  webhook_url: ""
  alert_types:
    xray: true
    movement: true

# Alert Preferences
alerts:
  silent_players: []
