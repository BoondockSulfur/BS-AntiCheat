# BSAntiCheat - Deutsche Sprachdatei
#
# FARBEN: alle gängigen Formate funktionieren und lassen sich in einer Zeile mischen.
#   &a &c &l &r              klassische Codes
#   &#9863E7                 Hex
#   &x&9&8&6&3&E&7           Hex in Spigots langer Schreibweise
#   <#9863E7> <red> <bold>   MiniMessage, auch <gradient:#ff0000:#0000ff>
# Ein Farbcode hebt Fett/Kursiv auf wie bisher. Alles, was kein Farb-Tag ist, bleibt
# unverändert stehen - deshalb steht "/bsac <reload|info|version>" unten weiterhin richtig.
#
# PLATZHALTER: %player% und Co. setzt das Plugin ein. Mit installiertem PlaceholderAPI
# werden zusätzlich alle anderen Platzhalter aufgelöst - in Alarmen und in
# Bestrafungsbefehlen, bezogen auf den Spieler, um den es geht.

