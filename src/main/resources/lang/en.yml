# AntiCheat violation alerts (admin chat, alert details, Discord)
alert:
  none: "&7No alerts for this player."
  click_hint: "&7Click to view details"
  location_unknown: "Unknown"
  location_summary: "World: %s, area: X[%d-%d] Y[%d-%d] Z[%d-%d]"
