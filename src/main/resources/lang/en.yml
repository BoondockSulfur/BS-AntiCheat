  speed: "Too fast (%s): %.2f b/t (max %.2f)"
  fly: "Illegal flight: %.2f b/t (max %.2f)"
  hover: "Hovering without falling (%d checks)"
  groundspoof: "GroundSpoof: claims on-ground while airborne"
  noslow: "NoSlow: %.2f b/t while using an item (max %.2f)"
  teleport: "Teleport-like movement: %.2f blocks"
  reach: "Reach: hit from %.2f blocks (max %.2f)"
  killaura_angle: "KillAura: hit %.0f deg off aim"
  killaura_multi: "KillAura: %d targets within %dms"
  killaura_rotation: "KillAura: non-human rotation (gcd %d)"
  nuker: "Nuker: %d blocks/s broken (max %d)"
  fastplace: "FastPlace: %d blocks/s placed (max %d)"
  scaffold: "Scaffold: placing %.0f deg off aim"
  autoclicker: "AutoClicker: %d CPS (max %d)"
  autoclicker_pattern: "AutoClicker: too consistent (SD %.1fms, %d CPS)"
