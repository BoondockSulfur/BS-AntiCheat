# BSAntiCheat - English Language File

general:
  prefix: "&8[&cBSAntiCheat&8]&r "
  no_permission: "&cYou don't have permission to do that."
  player_not_found: "&cPlayer not found: &f%player%"
  config_reloaded: "&aConfiguration reloaded."
  only_players: "&cThis command can only be used by players."

bsac:
  usage: "&eUsage: &f/bsac <reload|info|version> [player]"
