  entry_movement: "&7[%time%] &e%type%: &f%details%"
  entry_movement_value: "&7  Value: &f%value% &7| Position: &f%pos%"
  entry_xray: "&7[%time%] &e%type%: &f%details% &7(%count% ores)"
  entry_xray_ores: "&7  Ores: &f%ores%"
  entry_xray_positions: "&7  Positions:"
  entry_xray_position: "&8    - &f%pos%"
  # Discord embed labels
  discord_xray_title: "XRay suspicion: %player%"
  discord_movement_title: "Movement suspicion: %player%"
  discord_player: "Player"
  discord_type: "Type"
  discord_details: "Details"
  discord_value: "Value"
  discord_position: "Position"
  discord_ores: "Ores"
  discord_positions: "Last positions"
